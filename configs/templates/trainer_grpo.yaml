trainer:
  name: grpo_default
  algorithm: grpo
  max_steps: 500
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 5e-6
  warmup_ratio: 0.1
  kl_coeff: 0.1
  reward_clip: 5.0
  rollout_batch_size: 4
  num_generations: 4
  save_steps: 250
  logging_steps: 25
  eval_prompts: 32
