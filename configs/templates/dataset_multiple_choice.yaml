dataset:
  name: multiple_choice_default
  type: multiple_choice
  path: data/multiple_choice/train.jsonl
  validation_path: data/multiple_choice/validation.jsonl
  test_path: null
  text_field: question
  choice_field: options
  answer_field: answer
  input_template: |
    {{question}}

    Options:
    {% for option in options %}
    {{option}}
    {% endfor %}
  target_template: "{{answer}}"
