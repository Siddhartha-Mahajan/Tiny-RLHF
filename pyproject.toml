[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-rlhf"
version = "0.1.0"
description = "A lightweight, extensible RLHF toolkit for SLMs"
readme = "README.md"
authors = [{ name = "TinyRLHF Authors" }]
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "accelerate>=0.28",
    "datasets>=2.19",
    "PyYAML>=6.0",
    "hydra-core>=1.3",
    "numpy>=1.24",
    "omegaconf>=2.3",
    "peft>=0.11",
    "pydantic>=2.5",
    "rich>=13",
    "torch>=2.1",
    "transformers>=4.40",
    "trl>=0.9",
]

[project.optional-dependencies]
unsloth = ["unsloth>=2024.6"]
reward_judges = ["openai"]
wandb = ["wandb>=0.16"]
dev = [
    "black>=24.3",
    "flake8>=7.0",
    "isort>=5.13",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "types-PyYAML",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs>=1.5",
]

[project.scripts]
tiny-rlhf = "tiny_rlhf.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tiny_rlhf*"]
