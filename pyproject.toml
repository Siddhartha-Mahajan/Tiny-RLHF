[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-rlhf"
version = "0.1.0"
description = "A lightweight, extensible RLHF toolkit for SLMs"
readme = "README.md"
authors = [{ name = "TinyRLHF Authors" }]
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "accelerate>=0.28",
    "datasets>=2.19",
    "PyYAML>=6.0",
    "numpy>=1.24",
    "peft>=0.11",
    "torch>=2.1",
    "transformers>=4.40",
    "trl>=0.9",
]

[project.optional-dependencies]
wandb = ["wandb>=0.16"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tiny_rlhf*"]
