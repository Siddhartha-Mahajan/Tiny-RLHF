defaults:
  - dataset:
      name: freeform_synthetic
      type: freeform
      path: data/freeform/train.jsonl
      validation_path: data/freeform/validation.jsonl
      input_field: prompt
      target_field: completion
  - model: ../../configs/templates/model_transformers.yaml
  - lora: ../../configs/templates/model_lora_peft.yaml
  - trainer:
      name: sft_freeform
      algorithm: sft
      num_train_epochs: 1
      per_device_train_batch_size: 1
      gradient_accumulation_steps: 1
      learning_rate: 5e-5
      logging_steps: 1
      save_steps: 20

run:
  pipeline: sft
  output_dir: outputs/examples/freeform_sft
  seed: 7
  logging:
    use_wandb: false
