defaults:
  - dataset:
      name: multiple_choice_synthetic
      type: multiple_choice
      path: data/multiple_choice/train.jsonl
      validation_path: data/multiple_choice/validation.jsonl
      test_path: null
      text_field: question
      choice_field: options
      answer_field: answer
      input_template: |
        {{question}}

        Options:
        {% for option in options %}
        {{option}}
        {% endfor %}
      target_template: "{{answer}}"
  - model: ../../configs/templates/model_transformers.yaml
  - lora: ../../configs/templates/model_lora_peft.yaml
  - trainer:
      name: sft_example
      algorithm: sft
      max_steps: 10
      per_device_train_batch_size: 1
      gradient_accumulation_steps: 1
      learning_rate: 5e-5
      num_train_epochs: 1
      logging_steps: 1
      save_steps: 10

run:
  pipeline: sft
  output_dir: outputs/examples/mc_sft
  seed: 42
  logging:
    use_wandb: false
