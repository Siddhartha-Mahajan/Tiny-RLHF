defaults:
  - dataset:
      name: multiple_choice_synthetic
      type: multiple_choice
      path: data/multiple_choice/train.jsonl
      validation_path: data/multiple_choice/validation.jsonl
      test_path: null
      text_field: question
      choice_field: options
      answer_field: answer
  - model: ../../configs/templates/model_transformers.yaml
  - lora: ../../configs/templates/model_lora_peft.yaml
  - trainer:
      name: grpo_example
      algorithm: grpo
      max_steps: 20
      per_device_train_batch_size: 1
      gradient_accumulation_steps: 1
      learning_rate: 1e-6
      warmup_ratio: 0.1
      rollout_batch_size: 2
      num_generations: 2
      logging_steps: 1
      save_steps: 20

run:
  pipeline: grpo
  output_dir: outputs/examples/mc_grpo
  seed: 3407
  logging:
    use_wandb: false
  reward:
    strategy: format_only
    judge:
      provider: placeholder
