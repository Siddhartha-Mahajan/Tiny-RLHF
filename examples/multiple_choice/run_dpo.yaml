defaults:
  - dataset:
      name: multiple_choice_preferences
      type: preference_pairs
      path: data/preferences/train.jsonl
      format: pairwise
      fields:
        prompt: prompt
        chosen: chosen
        rejected: rejected
  - model: ../../configs/templates/model_transformers.yaml
  - lora: ../../configs/templates/model_lora_peft.yaml
  - trainer:
      name: dpo_example
      algorithm: dpo
      beta: 0.1
      per_device_train_batch_size: 1
      gradient_accumulation_steps: 2
      learning_rate: 2e-6
      num_train_epochs: 1
      logging_steps: 1
      save_steps: 20

run:
  pipeline: dpo
  output_dir: outputs/examples/mc_dpo
  seed: 2024
  logging:
    use_wandb: false
